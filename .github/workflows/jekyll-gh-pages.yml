name: Build Puccy App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Theos Dependencies
      run: |
        brew install ldid xz

    - name: Setup Theos Environment
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Setup iOS SDK
      run: |
        rm -rf $HOME/theos/sdks
        git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

    - name: Build Swift Support Tools (The Right Way)
      run: |
        export THEOS=$HOME/theos
        cd $THEOS
        git submodule update --init --recursive vendor/swift-support
        # الأمر الرسمي لبناء أداة generate-output-file-map الناقصة ديريكت
        make -C vendor/swift-support

    - name: Compile Package
      run: |
        export THEOS_NO_SWIFT_CACHE=3
        make clean package
      env:
        THEOS: ${{ env.THEOS }}

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Puccy-Package
        path: packages/*.deb
